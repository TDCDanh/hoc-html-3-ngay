<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDCDanh's Path - Hyper-Liquid Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              oop: "#3b82f6",
              dsa: "#10b981",
              vtp: "#8b5cf6",
              gemini: "#4285f4",
            },
            animation: {
              glow: "glow 4s ease-in-out infinite",
              float: "float 5s ease-in-out infinite",
              "gradient-x": "gradient-x 3s ease infinite",
            },
            keyframes: {
              glow: { "0%, 100%": { opacity: "0.5" }, "50%": { opacity: "1" } },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-12px)" },
              },
              "gradient-x": {
                "0%, 100%": {
                  "background-size": "200% 200%",
                  "background-position": "left center",
                },
                "50%": {
                  "background-size": "200% 200%",
                  "background-position": "right center",
                },
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #010409;
        color: #f8fafc;
        overflow-x: hidden;
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(59, 130, 246, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 0%,
            rgba(139, 92, 246, 0.1) 0px,
            transparent 50%
          );
      }

      .glass-panel {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.05) 0%,
          rgba(255, 255, 255, 0.01) 100%
        );
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
      }

      .liquid-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        cursor: pointer;
      }

      .liquid-card:hover {
        transform: translateY(-8px);
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.04);
      }

      .note-widget {
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        width: 100%;
      }

      @media (min-width: 1024px) {
        .note-widget {
          width: 400px;
        }
        .note-widget.collapsed {
          width: 60px;
          height: 60px;
          min-height: 60px;
          padding: 0;
          border-radius: 20px;
          background: #3b82f6;
          overflow: hidden;
        }
      }

      .note-widget.collapsed .note-content {
        opacity: 0;
        pointer-events: none;
      }
      .note-widget.collapsed .collapse-btn {
        transform: rotate(180deg);
        top: 18px;
        right: 18px;
        color: white;
      }
      .note-widget.collapsed .collapse-icon-only {
        display: block;
      }

      .collapse-icon-only {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
      }

      .note-area {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 15px;
        color: #f1f5f9;
        width: 100%;
        height: 280px;
        resize: none;
        outline: none;
        font-size: 13px;
      }

      .gemini-btn {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 1000;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px 24px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        text-decoration: none;
      }
      .gemini-btn:hover {
        transform: translateY(-5px);
        border-color: rgba(66, 133, 244, 0.5);
        box-shadow: 0 20px 40px rgba(66, 133, 244, 0.2);
      }

      .gemini-star {
        fill: url(#gemini-grad);
        filter: drop-shadow(0 0 5px rgba(66, 133, 244, 0.6));
      }

      .task-checkbox {
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        position: relative;
        background: rgba(0, 0, 0, 0.3);
      }
      .task-checkbox:checked {
        background: #fff;
        border-color: transparent;
      }
      .task-checkbox:checked::after {
        content: "✓";
        position: absolute;
        color: #000;
        font-size: 12px;
        font-weight: 900;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .task-completed {
        opacity: 0.5;
        filter: grayscale(0.5);
      }

      input[type="file"] {
        display: none;
      }

      .progress-gradient {
        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
        background-size: 200% auto;
        animation: gradient-x 3s linear infinite;
      }

      svg circle {
        transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .open-file-btn {
        opacity: 0;
        transform: translateX(-10px);
        transition: all 0.3s ease;
      }
      .file-loaded .open-file-btn {
        opacity: 1;
        transform: translateX(0);
      }
    </style>
  </head>
  <body class="min-h-screen py-16 px-6">
    <a href="https://gemini.google.com" target="_blank" class="gemini-btn">
      <svg
        class="w-6 h-6"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"

            <stop offset="100%" style="stop-color: #9b51e0; stop-opacity: 1" />

        <path
          class="gemini-star"
          d="M12 0L14.6 8.4L23 11L14.6 13.6L12 22L9.4 13.6L1 11L9.4 8.4L12 0Z"

    <div

      class="fixed inset-0 bg-black/80 backdrop-blur-2xl z-[2000] hidden items-center justify-center p-6"

        onclick="event.stopPropagation()"

        <div id="modal-body" class="max-h-[70vh] overflow-y-auto pr-4"></div>
        <button
          onclick="closeModal()"
          class="mt-8 w-full py-5 rounded-3xl bg-white/5 text-slate-400 font-black hover:bg-white/10 transition-all uppercase tracking-[0.2em] text-[10px]"
        >
          Đóng cửa sổ
        </button>
      </div>
    </div>

    <div class="max-w-7xl mx-auto">

        <div class="flex-grow">

            </h1>
            <p class="text-slate-500 text-lg">Lùi 1 bước để tiến 3 bước</p>
          </header>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

            <div

                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path

                      />
                    </svg>
                  </button>
                  <button
                    onclick="openToc('dsa')"
                    class="p-2.5 rounded-2xl bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500 hover:text-white transition-all"

                    <svg
                      class="w-5 h-5"
                      fill="none"

                      viewBox="0 0 24 24"
                    >

                </div>
              </div>
              <div class="flex flex-col gap-3">
                <label

                >
                  <span id="file-label-dsa">TẢI LÊN FILE</span>
                  <input type="file" onchange="handleFileUpload(this, 'dsa')" />
                </label>
              </div>
            </div>

            <!-- OOP Card -->
            <div
              id="card-oop"
              class="glass-panel p-8 rounded-[3rem] liquid-card group"
            >
              <div class="flex justify-between items-center mb-8">
                <span
                  class="text-[14px] font-black text-blue-500 uppercase tracking-widest"
                  >OOP</span
                >
                <div class="flex gap-2">
                  <button
                    id="view-oop"
                    onclick="openFile('oop')"
                    class="open-file-btn p-2.5 rounded-2xl bg-white/5 text-slate-400 hover:bg-blue-500 hover:text-white transition-all"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-width="2.5"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                      />
                    </svg>
                  </button>
                  <button
                    onclick="openToc('oop')"
                    class="p-2.5 rounded-2xl bg-blue-500/10 text-blue-500 hover:bg-blue-500 hover:text-white transition-all"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path stroke-width="2.5" d="M4 6h16M4 12h16M4 18h7" />
                    </svg>
                  </button>
                </div>
              </div>
              <div class="flex flex-col gap-3">
                <label
                  class="w-full py-4 rounded-2xl bg-blue-500/10 text-[10px] font-black text-blue-400 hover:bg-blue-500/20 flex items-center justify-center gap-3 cursor-pointer transition-all"
                >
                  <span id="file-label-oop">TẢI LÊN FILE</span>
                  <input type="file" onchange="handleFileUpload(this, 'oop')" />
                </label>
              </div>
            </div>

            <!-- VTP Card -->
            <div
              id="card-vtp"
              class="glass-panel p-8 rounded-[3rem] liquid-card group"
            >
              <div class="flex justify-between items-center mb-8">
                <span
                  class="text-[14px] font-black text-purple-400 uppercase tracking-widest"
                  >VTP</span
                >
                <div class="flex gap-2">
                  <button
                    id="view-vtp"
                    onclick="openFile('vtp')"
                    class="open-file-btn p-2.5 rounded-2xl bg-white/5 text-slate-400 hover:bg-purple-500 hover:text-white transition-all"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-width="2.5"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                      />
                    </svg>
                  </button>
                  <button
                    onclick="openToc('vtp')"
                    class="p-2.5 rounded-2xl bg-purple-500/10 text-purple-400 hover:bg-purple-500 hover:text-white transition-all"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path stroke-width="2.5" d="M4 6h16M4 12h16M4 18h7" />
                    </svg>
                  </button>
                </div>
              </div>
              <div class="flex flex-col gap-3">
                <label
                  class="w-full py-4 rounded-2xl bg-purple-500/10 text-[10px] font-black text-purple-400 hover:bg-purple-500/20 flex items-center justify-center gap-3 cursor-pointer transition-all"
                >
                  <span id="file-label-vtp">TẢI LÊN FILE</span>
                  <input type="file" onchange="handleFileUpload(this, 'vtp')" />
                </label>
              </div>
            </div>
          </div>
        </div>

        <div
          id="note-widget"
          class="glass-panel p-10 rounded-[4rem] note-widget relative h-[420px]"
        >
          <button
            onclick="toggleNote()"
            class="collapse-btn absolute top-8 right-8 p-3 rounded-2xl bg-white/5 hover:bg-white/10 text-slate-400 transition-all z-10"
          >
            <svg
              class="w-5 h-5 transition-transform duration-500"

                  fill="none"
                  stroke="currentColor"

          </div>
        </div>
      </div>

      <div
        class="glass-panel p-14 rounded-[5rem] mb-20 flex flex-col md:flex-row items-center gap-16"
      >
        <div class="relative w-44 h-44">
          <svg class="w-44 h-44">
            <defs>
              <linearGradient

                x1="0%"
                y1="0%"
                x2="100%"
                y2="0%"

                <stop offset="50%" stop-color="#8b5cf6" />
                <stop offset="100%" stop-color="#ec4899" />
              </linearGradient>
            </defs>
            <circle
              class="text-white/5"
              stroke-width="12"
              stroke="currentColor"
              fill="transparent"
              r="80"
              cx="88"
              cy="88"
            />
            <circle
              id="progress-circle"
              stroke="url(#circleGradient)"
              stroke-width="12"
              stroke-dasharray="502"
              stroke-dashoffset="502"
              stroke-linecap="round"
              fill="transparent"
              r="80"
              cx="88"
              cy="88"
              style="transform: rotate(-90deg); transform-origin: center"
            />
          </svg>
          <div
            class="absolute inset-0 flex flex-col items-center justify-center"
          >
            <span
              id="circle-percent"
              class="text-5xl font-black text-white tracking-tighter"
              >0%</span
            >
          </div>
        </div>
        <div class="flex-grow w-full">
          <div class="flex justify-between items-end mb-6">
            <div>
              <h2
                class="text-4xl font-black text-white tracking-tighter uppercase"
              >
                Progress Monitoring
              </h2>
            </div>
            <span
              id="tasks-count"
              class="text-[11px] font-black text-slate-400 bg-white/5 px-4 py-2 rounded-xl"
              >0/42</span
            >
          </div>
          <div
            class="h-5 w-full bg-white/5 rounded-full overflow-hidden border border-white/5 p-1"
          >
            <div
              id="progress-bar"
              class="h-full progress-gradient rounded-full transition-all duration-1000 shadow-[0_0_20px_rgba(139,92,246,0.3)]"
              style="width: 0%"
            ></div>
          </div>
        </div>
      </div>

      <div
        id="schedule-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"
      ></div>
    </div>

      function handleFileUpload(input, key) {
        if (input.files && input.files[0]) {
          const file = input.files[0];
          const fileName = file.name;
          const fileUrl = URL.createObjectURL(file);

          localStorage.setItem(`file_${key}`, fileName);
          localStorage.setItem(`file_url_${key}`, fileUrl); // Lưu tạm URL (chỉ có hiệu lực trong session hiện tại)

          document.getElementById(`file-label-${key}`).textContent =
            fileName.substring(0, 10) + (fileName.length > 10 ? ".." : "");
          document.getElementById(`card-${key}`).classList.add("file-loaded");
        }
      }

      function openFile(key) {
        const url = localStorage.getItem(`file_url_${key}`);
        if (url) {
          window.open(url, "_blank");
        } else {
          alert("Vui lòng tải file lên trước!");
        }
      }

      function updateProgress() {
        const total = studyData.length * 2;
        let done = 0;
        studyData.forEach((d) => {
          if (localStorage.getItem(`day_${d.id}_task_0`) === "true") done++;
          if (localStorage.getItem(`day_${d.id}_task_1`) === "true") done++;
        });
        const percent = Math.round((done / total) * 100);
        const circ = 502;
        document.getElementById("progress-circle").style.strokeDashoffset =
          circ - (percent / 100) * circ;
        document.getElementById("circle-percent").textContent = `${percent}%`;
        document.getElementById("progress-bar").style.width = `${percent}%`;
        document.getElementById("tasks-count").textContent = `${done}/${total}`;
      }

      function toggleTask(dayId, idx, event) {
        event.stopPropagation();
        const checked = event.target.checked;
        localStorage.setItem(`day_${dayId}_task_${idx}`, checked);
        document
          .getElementById(`task-${dayId}-${idx}`)
          .classList.toggle("task-completed", checked);
        updateProgress();
      }
