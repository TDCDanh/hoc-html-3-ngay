<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Định hướng Sự nghiệp 2026 - Liquid Glass Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap");

      :root {
        --primary: #3b82f6;
        --secondary: #8b5cf6;
        --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e5e7eb 100%);
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        color: #1f2937;
      }

      /* Liquid Glass Effect */
      .liquid-glass {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 24px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }

      /* Animated Liquid Buttons */
      .btn-liquid {
        position: relative;
        padding: 12px 28px;
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 1;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .btn-liquid::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300%;
        height: 300%;
        background: var(--primary);
        transition: all 0.6s ease;
        transform: translate(-50%, -50%) scale(0.1);
        border-radius: 50%;
        z-index: -1;
        opacity: 0;
      }

      .btn-liquid:hover::before {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }

      .btn-liquid:hover {
        color: white !important;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      }

      .btn-active {
        background: var(--primary);
        color: white !important;
        box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
      }

      /* Custom Checkbox */
      input[type="checkbox"] {
        appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid #cbd5e1;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
      }

      input[type="checkbox"]:checked {
        background-color: var(--primary);
        border-color: var(--primary);
      }

      input[type="checkbox"]:checked::after {
        content: "✓";
        position: absolute;
        color: white;
        font-size: 14px;
        left: 3px;
        top: -2px;
      }

      /* Step Circle Glow */
      .step-circle {
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        transition: transform 0.3s ease;
      }

      .step-item:hover .step-circle {
        transform: scale(1.15);
        background: var(--primary);
        color: white;
      }

      .floating {
        animation: floating 3s ease-in-out infinite;
      }

      @keyframes floating {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }
    </style>
  </head>
  <body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
      <!-- Main Header -->
      <div class="text-center mb-12 floating">
        <h1
          class="text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-violet-600 mb-4"
        >
          Career Roadmap 2026
        </h1>
        <p class="text-gray-500 font-medium text-lg">
          Thiết kế lộ trình tương lai của bạn với phong cách Liquid Glass
        </p>
      </div>

      <!-- Navigation Liquid Tabs -->
      <div class="flex flex-wrap justify-center gap-4 mb-12">
        <button
          onclick="switchPath('security')"
          id="btn-security"
          class="btn-liquid liquid-glass btn-active flex items-center"
        >
          <i class="fas fa-user-shield mr-2"></i> An Ninh Mạng Công An
        </button>
        <button
          onclick="switchPath('fullstack')"
          id="btn-fullstack"
          class="btn-liquid liquid-glass text-blue-600 flex items-center"
        >
          <i class="fas fa-layer-group mr-2"></i> Full Stack Developer
        </button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Sidebar: Skills -->
        <div class="lg:col-span-4 space-y-6">
          <div class="liquid-glass p-8 h-full">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
              <span class="p-2 bg-blue-100 rounded-lg mr-3">
                <i class="fas fa-brain text-blue-600"></i>
              </span>
              Kỹ năng 2026
            </h2>

            <div id="skills-list" class="space-y-3">
              <!-- Skills loaded by JS -->
            </div>

            <div
              class="mt-10 p-6 bg-white/40 rounded-2xl border border-white/60"
            >
              <div class="flex justify-between items-end mb-3">
                <span class="text-sm font-bold text-gray-600"
                  >Tiến độ sẵn sàng</span
                >
                <span
                  id="readiness-percent"
                  class="text-2xl font-black text-blue-600"
                  >0%</span
                >
              </div>
              <div
                class="w-full bg-gray-200/50 rounded-full h-3 overflow-hidden"
              >
                <div
                  id="readiness-bar"
                  class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full w-0 transition-all duration-700 ease-out"
                ></div>
              </div>
              <p
                id="readiness-text"
                class="text-xs text-gray-500 mt-3 font-medium uppercase tracking-wider"
              >
                Bắt đầu hành trình ngay!
              </p>
            </div>
          </div>
        </div>

        <!-- Content: Roadmap -->
        <div class="lg:col-span-8">
          <div class="liquid-glass p-8 md:p-10">
            <div class="flex items-center justify-between mb-10">
              <h2
                id="path-title"
                class="text-3xl font-bold text-gray-800 tracking-tight"
              >
                Lộ trình thực hiện
              </h2>
              <span
                class="px-4 py-1 bg-white/50 border border-white text-blue-600 rounded-full text-sm font-bold shadow-sm"
                >Updated 2026</span
              >
            </div>

            <div id="roadmap-steps" class="space-y-12 relative">
              <!-- Roadmap Line -->
              <div
                class="absolute left-[19px] top-4 bottom-4 w-0.5 bg-gradient-to-b from-blue-400/50 via-indigo-400/50 to-transparent"
              ></div>

              <!-- Steps loaded by JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Footer Note -->
      <footer class="mt-12 text-center text-gray-400 text-sm">
        <p>
          © 2026 Career Planner Pro • Sinh viên CTU • Khám phá giới hạn bản thân
        </p>
      </footer>
    </div>

    <script>
      const paths = {
        security: {
          title: "An Ninh Mạng (Công An A05)",
          skills: [
            "Quản trị mạng CCNA & Linux",
            "Pháp luật & Luật An ninh mạng",
            "Điều tra số (Forensics)",
            "Mật mã học & Cryptography",
            "Reverse Engineering (Dịch ngược)",
            "Kỹ năng tác chiến không gian mạng",
          ],
          steps: [
            {
              year: "2024-2025",
              task: "Nền tảng mạng & Hệ điều hành",
              desc: "Tập trung vào Linux, giao thức TCP/IP và rèn luyện thể chất.",
              icon: "fa-shield-heart",
            },
            {
              year: "2025-2026",
              task: "Chuyên môn bảo mật & Pháp luật",
              desc: "Học các chứng chỉ như CEH, Security+. Tìm hiểu thủ tục tuyển dụng ngành CA.",
              icon: "fa-gavel",
            },
            {
              year: "2026",
              task: "Gia nhập & Đào tạo nghiệp vụ",
              desc: "Trúng tuyển vào A05 hoặc học Văn bằng 2 tại Học viện ANND.",
              icon: "fa-user-check",
            },
          ],
        },
        fullstack: {
          title: "Full Stack Developer (Next-Gen)",
          skills: [
            "Next.js 16 & TypeScript 6",
            "AI Integration (LLM APIs)",
            "Cloud Native (Kubernetes/Docker)",
            "Golang/Rust for Backend",
            "System Design & Architecture",
            "DevOps & CI/CD Mastery",
          ],
          steps: [
            {
              year: "2024-2025",
              task: "Nắm vững Modern Web Stack",
              desc: "Xây dựng các dự án thực tế với React, Node.js và SQL/NoSQL.",
              icon: "fa-laptop-code",
            },
            {
              year: "2025-2026",
              task: "AI-Driven Development",
              desc: "Học cách tích hợp AI vào quy trình code và sản phẩm. Thực tập tại Big Tech.",
              icon: "fa-microchip",
            },
            {
              year: "2026",
              task: "Senior Full Stack Journey",
              desc: "Làm chủ hệ thống phân tán và dẫn dắt các dự án quy mô toàn cầu.",
              icon: "fa-rocket",
            },
          ],
        },
      };

      let currentPath = "security";
      let checkedSkills = new Set();

      function switchPath(pathKey) {
        currentPath = pathKey;
        checkedSkills.clear();

        // UI Button Active State
        const btnSec = document.getElementById("btn-security");
        const btnFS = document.getElementById("btn-fullstack");

        if (pathKey === "security") {
          btnSec.classList.add("btn-active");
          btnSec.classList.remove("text-blue-600");
          btnFS.classList.remove("btn-active");
          btnFS.classList.add("text-blue-600");
        } else {
          btnFS.classList.add("btn-active");
          btnFS.classList.remove("text-blue-600");
          btnSec.classList.remove("btn-active");
          btnSec.classList.add("text-blue-600");
        }

        renderContent();
        updateProgress();
      }

      function renderContent() {
        const data = paths[currentPath];
        document.getElementById("path-title").innerText = data.title;

        // Render Skills
        const skillsContainer = document.getElementById("skills-list");
        skillsContainer.innerHTML = data.skills
          .map(
            (skill) => `
                <label class="group flex items-center p-3 rounded-xl hover:bg-white/60 transition-all border border-transparent hover:border-white/80 cursor-pointer">
                    <input type="checkbox" onchange="toggleSkill('${skill}')" class="mr-4">
                    <span class="text-gray-700 font-medium group-hover:text-blue-600 transition-colors">${skill}</span>
                </label>
            `,
          )
          .join("");

        // Render Roadmap
        const roadmapContainer = document.getElementById("roadmap-steps");
        roadmapContainer.innerHTML = data.steps
          .map(
            (step) => `
                <div class="step-item relative pl-14 transition-all duration-300">
                    <div class="step-circle absolute left-0 top-0 w-10 h-10 bg-white rounded-full flex items-center justify-center border-2 border-blue-400 z-10 text-blue-500">
                        <i class="fas ${step.icon}"></i>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full border border-blue-100 uppercase tracking-widest">${step.year}</span>
                        <h3 class="text-xl font-bold text-gray-800 mt-2">${step.task}</h3>
                        <p class="text-gray-500 mt-1 text-sm leading-relaxed">${step.desc}</p>
                    </div>
                </div>
            `,
          )
          .join("");
      }

      function toggleSkill(skill) {
        if (checkedSkills.has(skill)) checkedSkills.delete(skill);
        else checkedSkills.add(skill);
        updateProgress();
      }

      function updateProgress() {
        const total = paths[currentPath].skills.length;
        const count = checkedSkills.size;
        const percentage = Math.round((count / total) * 100);

        document.getElementById("readiness-bar").style.width = percentage + "%";
        document.getElementById("readiness-percent").innerText =
          percentage + "%";

        let status = "Bắt đầu hành trình ngay!";
        if (percentage > 30) status = "Đang đi đúng hướng!";
        if (percentage > 70) status = "Sắp sẵn sàng cho 2026!";
        if (percentage === 100) status = "Kỹ sư xuất sắc 2026!";

        document.getElementById("readiness-text").innerText = status;
      }

      // Initialize
      window.onload = renderContent;
    </script>
  </body>
</html>
