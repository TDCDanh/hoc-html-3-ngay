      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #020617;
        color: #f8fafc;
        overflow-x: hidden;
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(59, 130, 246, 0.18) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            rgba(239, 68, 68, 0.12) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 50% 50%,
            rgba(16, 185, 129, 0.08) 0px,
            transparent 50%
          );
      }

      .glass-panel {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.02) 100%
        );
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.6),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
      }

      .liquid-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }

      .liquid-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.05),
          transparent
        );
        transform: skewX(-25deg);
        transition: 0.75s;
      }

      .liquid-card:hover::before {
        left: 150%;
      }

      .liquid-card:hover {
        transform: translateY(-8px);
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.7);
      }

      .progress-ring__circle {
        transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5));
      }

      .progress-bar-container {
        height: 10px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 99px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(
          90deg,
          #10b981 0%,
          #3b82f6 50%,
          #ef4444 100%
        );
        background-size: 200% 100%;
        transition: width 1s cubic-bezier(0.65, 0, 0.35, 1);
      }

      .task-checkbox {
        appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 7px;
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
      }

      .task-checkbox:checked {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border-color: transparent;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
      }

      .task-checkbox:checked::after {
        content: "✓";
        position: absolute;
        color: white;
        font-size: 12px;
        font-weight: 800;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.85);
        backdrop-filter: blur(30px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #modal-overlay.active {
        display: flex;
        animation: fadeIn 0.4s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .note-area {
        background: rgba(255, 255, 255, 0.015);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 18px;
        color: #e2e8f0;
        font-size: 0.85rem;
        width: 100%;
        min-height: 120px;
        resize: none;
        outline: none;
        transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .note-area:focus {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(59, 130, 246, 0.4);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
      }

      .brand-text {
        font-weight: 800;
        letter-spacing: -0.05em;
      }
      .brand-path {
        font-weight: 300;
        font-style: italic;
        opacity: 0.8;
      }
    </style>

          sessions: [
            { sub: "VTP", title: "TP từng phần" },
            { sub: "DSA", title: "BST Insert" },
          ],
          detail: "Các phương pháp tính tích phân nâng cao.",
        },
        {
          id: "d19",
          date: "07/05",
          day: "T5",
          focus: "Chuỗi",
          sessions: [
            { sub: "VTP", title: "Chuỗi số" },

          ],
          detail: "Tiêu chuẩn hội tụ chuỗi và trừu tượng hóa lớp.",

        {
          id: "d20",
          date: "08/05",
          day: "T6",
          focus: "Taylor",
          sessions: [
            { sub: "DSA", title: "Tổng hợp" },
            { sub: "VTP", title: "Taylor" },
          ],
          detail: "Khai triển chuỗi lũy thừa.",
        },
        {
          id: "d21",
          date: "09/05",
          day: "T7",
          focus: "Kết thúc",
          sessions: [

          ],
          detail: "Tổng kiểm tra toàn bộ lỗ hổng kiến thức.",
        },
      ];

      const quotes = [
        "Lùi 1 bước để tiến 3 bước",
        "Kỷ luật là cái giá của sự tự do.",
        "Thành công không phải là điểm đến, đó là một hành trình.",
        "Hãy làm việc trong im lặng, để thành công là tiếng vang của bạn.",
      ];

      const fileStore = { dsa: null, oop: null, vtp: null };

      function handleFile(input, key) {
        if (input.files && input.files[0]) {
          const file = input.files[0];
          fileStore[key] = URL.createObjectURL(file);
          document.getElementById(`label-${key}`).textContent = file.name;
          document.getElementById(`btn-${key}`).classList.remove("hidden");
          showToast(`Đã nạp: ${file.name}`);
        }
      }

      function openFile(key) {
        if (fileStore[key]) window.open(fileStore[key], "_blank");
      }

      function saveNotes() {
        localStorage.setItem(
          "tdcdanh_notes",
          document.getElementById("quick-notes").value,
        );
      }

      function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("opacity-100", "translate-y-0");
        setTimeout(
          () => toast.classList.remove("opacity-100", "translate-y-0"),
          3000,
        );
      }

      function updateProgress() {
        const total = studyData.length * 2;
        let done = 0;
        studyData.forEach((d) => {
          if (localStorage.getItem(`day_${d.id}_task_0`) === "true") done++;
          if (localStorage.getItem(`day_${d.id}_task_1`) === "true") done++;
        });

        const percent = Math.round((done / total) * 100);

        const circle = document.getElementById("progress-circle");
        const circumference = 2 * Math.PI * 65;
        circle.style.strokeDashoffset =
          circumference - (percent / 100) * circumference;
        document.getElementById("circle-percent").textContent = `${percent}%`;

        document.getElementById("progress-bar").style.width = `${percent}%`;
        document.getElementById("tasks-done-count").textContent = done;

        const label = document.getElementById("status-label");
        if (percent === 100) {
          label.textContent = "Huyền thoại đã hoàn thành";
          label.className =
            "px-5 py-2 rounded-2xl bg-red-500/20 text-red-400 text-[10px] font-black uppercase tracking-wider border border-red-500/20";
        } else if (percent > 50) {
          label.textContent = "Đang tăng tốc cực nhanh";
          label.className =
            "px-5 py-2 rounded-2xl bg-blue-500/20 text-blue-400 text-[10px] font-black uppercase tracking-wider border border-blue-500/20";
        } else {
          label.textContent = "Khởi đầu vững chắc";
          label.className =
            "px-5 py-2 rounded-2xl bg-emerald-500/20 text-emerald-400 text-[10px] font-black uppercase tracking-wider border border-emerald-500/20";
        }
      }

      function toggleTask(dayId, idx, event) {
        event.stopPropagation();
        const checked = document.getElementById(
          `check-${dayId}-${idx}`,
        ).checked;
        localStorage.setItem(`day_${dayId}_task_${idx}`, checked);
        updateProgress();
      }

      function openModal(dayId) {
        const day = studyData.find((d) => d.id === dayId);
        const body = document.getElementById("modal-body");
        body.innerHTML = `
                <div class="mb-10">
                    <p class="text-[10px] font-black text-blue-500 uppercase tracking-[0.3em] mb-3">${day.day} • ${day.focus}</p>
                    <h2 class="text-6xl font-black text-white tracking-tighter">${day.date}</h2>
                </div>
                <div class="p-8 rounded-[2.5rem] bg-white/5 border border-white/5 mb-10">
                    <p class="text-slate-300 text-lg leading-relaxed italic">"${day.detail}"</p>
                </div>
                <div class="space-y-4">
                    ${day.sessions
                      .map((s, idx) => {
                        const isDone =
                          localStorage.getItem(`day_${day.id}_task_${idx}`) ===
                          "true";
                        return `
                            <div class="p-6 rounded-3xl bg-white/5 border border-white/5 flex justify-between items-center group hover:bg-white/10 transition-all">
                                <div class="flex items-center gap-4">
                                    <div class="w-3 h-3 rounded-full ${s.sub === "DSA" ? "bg-emerald-400" : s.sub === "VTP" ? "bg-purple-400" : "bg-blue-400"} shadow-lg shadow-current/20"></div>
                                    <span class="text-lg font-bold text-slate-100">${s.sub}: ${s.title}</span>
                                </div>
                                <span class="text-[10px] font-black tracking-widest ${isDone ? "text-emerald-400" : "text-slate-600"}">
                                    ${isDone ? "COMPLETED" : "PENDING"}
                                </span>
                            </div>
                        `;
                      })
                      .join("")}
                </div>
            `;
        document.getElementById("modal-overlay").classList.add("active");
      }

      function closeModal() {
        document.getElementById("modal-overlay").classList.remove("active");
      }

      function render() {
        const grid = document.getElementById("schedule-grid");
        studyData.forEach((day) => {
          const card = document.createElement("div");
          card.className = "liquid-card rounded-[3.5rem] p-10 cursor-pointer";
          card.onclick = () => openModal(day.id);

          let sessionHTML = day.sessions
            .map((s, idx) => {
              const isDone =
                localStorage.getItem(`day_${day.id}_task_${idx}`) === "true";
              return `
                        <div class="flex items-center justify-between group/item">
                            <div class="flex items-center gap-4">
                                <div class="w-2 h-2 rounded-full ${s.sub === "DSA" ? "bg-emerald-400" : s.sub === "VTP" ? "bg-purple-400" : "bg-blue-400"}"></div>
                                <span class="text-sm font-bold text-slate-300 group-hover/item:text-white transition-colors">${s.title}</span>
                            </div>
                            <input type="checkbox" id="check-${day.id}-${idx}" class="task-checkbox" ${isDone ? "checked" : ""} onclick="toggleTask('${day.id}', ${idx}, event)">
                        </div>
                    `;
            })
            .join("");

          card.innerHTML = `
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2">${day.day} • ${day.focus}</p>
                            <h3 class="text-4xl font-black text-white tracking-tighter">${day.date}</h3>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-slate-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M12 4v16m8-8H4"></path></svg></div>
                    </div>
                    <div class="space-y-6 pt-8 border-t border-white/5">
                        ${sessionHTML}
                    </div>
                `;
          grid.appendChild(card);
        });

        document.getElementById("quick-notes").value =
          localStorage.getItem("tdcdanh_notes") || "";
        document.getElementById("daily-quote").textContent = `"${quotes[0]}"`; // Ưu tiên câu trích dẫn yêu cầu
        updateProgress();
      }

      window.onload = render;
    </script>
  </body>
</html>
