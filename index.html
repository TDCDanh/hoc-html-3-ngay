<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDCDanh's Path - Hyper-Liquid Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              oop: "#3b82f6",
              dsa: "#10b981",
              vtp: "#8b5cf6",
              gemini: "#4285f4",
            },
            animation: {
              glow: "glow 4s ease-in-out infinite",
              float: "float 5s ease-in-out infinite",
              "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            },
            keyframes: {
              glow: { "0%, 100%": { opacity: "0.5" }, "50%": { opacity: "1" } },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-12px)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #010409;
        color: #f8fafc;
        overflow-x: hidden;
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(59, 130, 246, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 0%,
            rgba(139, 92, 246, 0.1) 0px,
            transparent 50%
          );
      }

      .glass-panel {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.05) 0%,
          rgba(255, 255, 255, 0.01) 100%
        );
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 30px 60px -12px rgba(0, 0, 0, 0.5),
          inset 0 1px 2px rgba(255, 255, 255, 0.05);
      }

      .liquid-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        position: relative;
      }

      .liquid-card:hover {
        transform: translateY(-10px) scale(1.02);
        border-color: rgba(59, 130, 246, 0.5);
        background: rgba(255, 255, 255, 0.05);
        box-shadow:
          0 35px 60px -15px rgba(0, 0, 0, 0.8),
          0 0 35px rgba(59, 130, 246, 0.25),
          inset 0 0 15px rgba(255, 255, 255, 0.05);
      }

      .note-widget {
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-origin: right top;
        width: 100%;
      }

      @media (min-width: 1024px) {
        .note-widget {
          width: 400px;
        }
        .note-widget.collapsed {
          width: 60px;
          height: 60px;
          min-height: 60px;
          padding: 0;
          border-radius: 20px;
          background: linear-gradient(135deg, #3b82f6, #2563eb);
          border-color: transparent;
          overflow: hidden;
        }
      }

      .note-widget.collapsed .note-content {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .note-widget.collapsed .collapse-btn {
        transform: rotate(180deg);
        top: 16px;
        right: 16px;
        color: white;
      }
      .note-widget.collapsed .collapse-icon-only {
        display: block;
      }

      .collapse-icon-only {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
      }

      .note-area {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 20px;
        color: #f1f5f9;
        width: 100%;
        height: 300px;
        resize: none;
        outline: none;
        transition: all 0.3s;
      }
      .note-area:focus {
        border-color: rgba(59, 130, 246, 0.5);
        background: rgba(255, 255, 255, 0.04);
      }

      .progress-ring__circle {
        transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }

      .gemini-portal {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 1000;
        background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
        padding: 14px 28px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        text-decoration: none;
      }
      .gemini-portal:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 30px 60px -12px rgba(37, 99, 235, 0.6);
      }

      .task-checkbox {
        appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 8px;
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
        transition: 0.3s;
        position: relative;
      }

      .task-checkbox-dsa:checked {
        background: #10b981;
        border-color: transparent;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      }
      .task-checkbox-oop:checked {
        background: #3b82f6;
        border-color: transparent;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
      }
      .task-checkbox-vtp:checked {
        background: #8b5cf6;
        border-color: transparent;
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }
      .task-checkbox-review:checked {
        background: #64748b;
        border-color: transparent;
        box-shadow: 0 0 12px rgba(100, 116, 139, 0.4);
      }

      .task-checkbox:checked::after {
        content: "✓";
        position: absolute;
        color: white;
        font-size: 12px;
        font-weight: 800;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .task-completed {
        opacity: 0.4 !important;
        filter: grayscale(0.5);
      }

      #modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.85);
        backdrop-filter: blur(30px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #modal-overlay.active {
        display: flex;
        animation: fadeIn 0.4s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>

        const file = input.files[0];

          document.getElementById(`label-${key}`).textContent = file.name;
          document.getElementById(`label-${key}`).className =
            "text-[11px] text-white font-bold truncate max-w-[100px]";
          document.getElementById(`view-${key}`).classList.remove("hidden");
        }

      function toggleNote() {
        document.getElementById("note-widget").classList.toggle("collapsed");
      }
      function saveNotes() {
        localStorage.setItem(
          "tdcdanh_notes_v3",
          document.getElementById("quick-notes").value,
        );
      }

      function updateProgress() {
        const total = studyData.length * 2;
        let done = 0;
        studyData.forEach((d) => {
          if (localStorage.getItem(`day_${d.id}_task_0`) === "true") done++;
          if (localStorage.getItem(`day_${d.id}_task_1`) === "true") done++;
        });
        const percent = Math.round((done / total) * 100);
        const circumference = 2 * Math.PI * 80;
        document.getElementById("progress-circle").style.strokeDashoffset =
          circumference - (percent / 100) * circumference;
        document.getElementById("circle-percent").textContent = `${percent}%`;
        document.getElementById("progress-bar").style.width = `${percent}%`;
        document.getElementById("tasks-count").textContent = `${done}/${total}`;
      }

      function toggleTask(dayId, idx, event) {
        event.stopPropagation();
        const checked = event.target.checked;
        localStorage.setItem(`day_${dayId}_task_${idx}`, checked);
        const taskBlock = document.getElementById(`task-${dayId}-${idx}`);
        if (taskBlock) {
          if (checked) taskBlock.classList.add("task-completed");
          else taskBlock.classList.remove("task-completed");
        }
        updateProgress();
      }

                        return `

            `;
        document.getElementById("modal-overlay").style.display = "flex";

      function closeModal() {
        document.getElementById("modal-overlay").style.display = "none";
